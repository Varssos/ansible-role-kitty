---
- name: Install kitty terminal
  apt:
    name: "{{ kitty_package_name }}"
    state: present


- name: Get kitty version
  command: kitty --version
  register: kitty_version_raw
  changed_when: false
  failed_when: false

- name: Extract kitty version number
  set_fact:
    kitty_version: "{{ kitty_version_raw.stdout.split()[1] }}"
  when: kitty_version_raw.rc == 0


- name: Apply Catppuccin Mocha theme
  shell: "kitty +kitten themes --reload-in=all {{ kitty_theme_name }}"
  become_user: "{{ ansible_user }}"
  when:
    - kitty_version is defined
    - kitty_version is version(kitty_min_theme_version, '>=')
# ~/.config/kitty/ should exist


# When applying catppuccin theme is not working
- name: Create ~/.config/kitty directory
  file:
    path: "{{ user_home_path }}/.config/kitty"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Make sure ~/.config/kitty/kitty.conf exists
  file:
    path: "{{ user_home_path }}/.config/kitty/kitty.conf"
    state: touch
    mode: "0644"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"


- name: Apply kitty stow (restow to pick up any changes)
  command:
    cmd: stow -R kitty
    chdir: "{{ dotfiles_path }}"
  become_user: "{{ ansible_user }}"
  register: kitty_stow
  changed_when: kitty_stow.stdout != '' or kitty_stow.stderr != ''
# ~/.config/kitty/kitty-private.conf should exist as symlink


- name: Ensure kitty-private.conf is included in kitty.conf
  lineinfile:
    path: "{{ user_home_path }}/.config/kitty/kitty.conf"
    regexp: '^\s*#?\s*include\s+kitty-private\.conf'
    line: 'include kitty-private.conf'
    state: present
  become_user: "{{ ansible_user }}"


- name: Get target user UID for GNOME session
  command: id -u
  become_user: "{{ ansible_user }}"
  register: kitty_user_uid
  changed_when: false
  when: ansible_distribution == 'Ubuntu'

- name: Check target user GNOME session bus
  stat:
    path: "/run/user/{{ kitty_user_uid.stdout }}/bus"
  register: kitty_user_session_bus
  when: ansible_distribution == 'Ubuntu'

- name: Configure Kitty GNOME keyboard shortcut
  block:
    - name: Read existing GNOME custom shortcuts
      command:
        argv:
          - gsettings
          - get
          - org.gnome.settings-daemon.plugins.media-keys
          - custom-keybindings
      register: kitty_custom_keybindings
      changed_when: false
      environment:
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ kitty_user_uid.stdout }}/bus"
        XDG_RUNTIME_DIR: "/run/user/{{ kitty_user_uid.stdout }}"

    - name: Add Kitty to GNOME custom shortcuts
      command:
        argv:
          - gsettings
          - set
          - org.gnome.settings-daemon.plugins.media-keys
          - custom-keybindings
          - "{{ ((kitty_custom_keybindings.stdout | regex_replace('^@as\\s+', '') | from_yaml) + ['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/kitty/']) | to_json }}"
      when: "'/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/kitty/' not in (kitty_custom_keybindings.stdout | regex_replace('^@as\\s+', '') | from_yaml)"
      environment:
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ kitty_user_uid.stdout }}/bus"
        XDG_RUNTIME_DIR: "/run/user/{{ kitty_user_uid.stdout }}"

    - name: Read Kitty GNOME shortcut settings
      command:
        argv:
          - gsettings
          - get
          - "org.gnome.settings-daemon.plugins.media-keys.custom-keybinding:/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/kitty/"
          - "{{ item.key }}"
      loop:
        - { key: name, value: "{{ kitty_shortcut_name }}" }
        - { key: command, value: "{{ kitty_shortcut_command }}" }
        - { key: binding, value: "{{ kitty_shortcut_binding }}" }
      register: kitty_shortcut_settings
      changed_when: false
      environment:
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ kitty_user_uid.stdout }}/bus"
        XDG_RUNTIME_DIR: "/run/user/{{ kitty_user_uid.stdout }}"

    - name: Set Kitty GNOME shortcut settings
      command:
        argv:
          - gsettings
          - set
          - "org.gnome.settings-daemon.plugins.media-keys.custom-keybinding:/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/kitty/"
          - "{{ item.item.key }}"
          - "{{ item.item.value }}"
      loop: "{{ kitty_shortcut_settings.results }}"
      when: (item.stdout | trim | from_yaml) != item.item.value
      environment:
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ kitty_user_uid.stdout }}/bus"
        XDG_RUNTIME_DIR: "/run/user/{{ kitty_user_uid.stdout }}"
  become_user: "{{ ansible_user }}"
  when:
    - ansible_distribution == 'Ubuntu'
    - kitty_user_session_bus.stat.exists
